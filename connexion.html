<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Connexion</title>
</head>
<body>
    <div class="contenair">
        <form class="login-form" action="#" method="post">
            <h1>Connexion</h1>
            <p class="login-description">Connectez-vous à votre compte SchoolApp.</p>

            <div class="form-field">
                <input id="email" name="email" type="email" autocomplete="email" placeholder="exemple@email.com" required>
            </div>

            <div class="form-field">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required>
            </div>

            <button type="submit">Se connecter</button>
            <a class="home-link" href="Index.html">Retour à l'accueil</a>
        </form>
    </div>
</body>
</html>
